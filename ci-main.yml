name: Publicação Automática (CD)

on:
  push:
    branches:
      - main

# Define as permissões necessárias para o GitHub Actions interagir com o GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy aconteça por vez para evitar conflitos
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código atualizado da branch main
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura os metadados do GitHub Pages no ambiente
      - name: Configurar ambiente do Pages
        uses: actions/configure-pages@v5

      # 3. Compacta os arquivos da raiz do projeto para o formato do Pages
      - name: Upload dos artefatos do site
        uses: actions/upload-pages-artifact@v3
        with:
          # Define a raiz (.) como origem, onde o index.html validado está localizado
          path: '.'

      # 4. Realiza o deploy (publicação) no servidor do GitHub Pages
      - name: Implantar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
